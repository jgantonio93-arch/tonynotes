name: RosaNotes (APK Android)

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "video/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: rosanotes-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Testes de funcionamento
        run: ./gradlew testDebugUnitTest --tests "*FunctionalTest*"

      # Só versões do main que passaram nos testes viram "Release" (o repositório é
      # público: qualquer pessoa baixa). O link fixo
      # https://github.com/<dono>/<repo>/releases/latest/download/RosaNotes.apk
      # sempre baixa a mais recente (é o link do botão do site). O app compara o
      # "buildN" da tag com o BUILD_NUMBER dele para avisar que há versão nova.
      - name: Publicar versão (link fixo de download)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="rosanotes-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/RosaNotes-debug.apk RosaNotes.apk
          gh release create "$TAG" RosaNotes.apk \
            --target "$GITHUB_SHA" \
            --title "RosaNotes ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Versão gerada automaticamente a partir de ${GITHUB_SHA::7}. Baixe o RosaNotes.apk e instale por cima da versão anterior: suas notas continuam lá." \
            --latest
          # Guarda só as 10 versões mais novas.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName | select(startswith("tonynotes-") or startswith("rosanotes-"))' \
            | tail -n +11 | xargs -r -n1 gh release delete --cleanup-tag -y

      - name: Gerar capturas de tela
        if: always()
        run: ./gradlew testDebugUnitTest --tests "*ScreenshotTest*" --stacktrace

      - name: Salvar capturas no branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Capturas sem mudanças."
          else
            git commit -m "Atualiza capturas de tela [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Branch mudou durante o build; capturas ficam para a próxima execução."
          fi
