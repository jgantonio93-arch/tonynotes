name: Vídeo de demonstração (quadros do app)

# Grava a demonstração do RosaNotes quadro a quadro (o app de verdade, no Robolectric)
# e publica os quadros como artefato. Roda quando o roteiro muda ou quando pedido.
on:
  push:
    paths:
      - "app/src/test/java/com/jgantonio/notasinfinitas/DemoRecordingTest.kt"
      - "app/src/test/java/com/jgantonio/notasinfinitas/DemoKit.kt"
      - "app/src/test/resources/demo/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gravar quadros
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests "*DemoRecordingTest*" -Ddemo.dir="$PWD/demo-frames" --stacktrace
          find demo-frames -name "*.jpg" | wc -l
      # Os quadros vão como anexo de uma versão "demo-frames" (pré-lançamento, fora da lista
      # de versões do app), substituída a cada gravação.
      - name: Publicar quadros
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd demo-frames && zip -q -r ../demo-frames.zip . && cd ..
          gh release view demo-frames >/dev/null 2>&1 || gh release create demo-frames --prerelease --title "Quadros do vídeo de demonstração" --notes "Gerado pelo workflow demo.yml." --target "$GITHUB_SHA"
          gh release upload demo-frames demo-frames.zip --clobber
